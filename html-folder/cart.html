<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museum Cart</title>
  <style>
    /* minimal on-page styles for clarity; move to your CSS later if you want */
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .controls { margin: 8px 0 12px; }
    .empty { padding: 12px; border: 1px dashed #666; font-style: italic; }
    pre#summary { background: #f8f8f8; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .actions { margin-top: 12px; display: flex; gap: 8px; }
    .line { display:flex; align-items:center; gap:10px; padding:6px 0; }
    .line-text { flex:1; }
    .line-amount { width: 160px; text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <header>
    <h1>Shopping Cart</h1>
  </header>

  <main>
    <!-- NEW CONTROLS (Cart page only) -->
    <div class="controls">
      <label><input type="checkbox" id="memberToggle"> Member Discount (15%)</label>
    </div>

    <!-- STATES & OUTPUT AREAS -->
    <div id="emptyMsg" class="empty" hidden>Your cart is empty.</div>
    <div id="items" hidden></div>
    <pre id="summary" hidden></pre>

    <!-- BASIC ACTIONS -->
    <div class="actions">
      <button id="clearBtn">Clear Cart</button>
      <a href="shop.html">Keep Shopping</a>
    </div>
  </main>

  <script>
  /* =================== PIPE FROM shop.html (leave as-is) =================== */
  const CART_KEY = 'museumCartV1'; // MUST match shop.html

  function readCart(){
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch { return []; }
  }
  function writeCart(cart){
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }
  /* ================= END PIPE ============================================= */

  /* ====================== UTILITIES & CONSTANTS =========================== */
  // Currency with parentheses for negatives
  function money(n){
    const sign = n < 0 ? -1 : 1;
    const s = '$' + Math.abs(n).toFixed(2);
    return sign < 0 ? '('+s+')' : s;
  }

  // Spec constants
  const TAX_RATE = 0.102;
  const MEMBER_DISCOUNT_RATE = 0.15;
  const SHIPPING_RATE = 25.00;
  const VOLUME_TIERS = [
    [0.00, 49.99, 0.00],
    [50.00, 99.99, 0.05],
    [100.00, 199.99, 0.10],
    [200.00, Infinity, 0.15]
  ];

  // Return the volume discount rate given an item total
  function volumeRate(total){
    for (const [min,max,rate] of VOLUME_TIERS){
      if (total >= min && total <= max) return rate;
    }
    return 0;
  }

  // Remove a line item entirely (qty=0 => drop row)
  function removeItem(id){
    const next = readCart().filter(it => it.id !== id);
    writeCart(next);
    render();
  }

  // Clear cart = initial state (cart empty, member unchecked)
  function clearCart(){
    writeCart([]);
    document.getElementById('memberToggle').checked = false;
    render();
  }
  /* ================== END UTILITIES & CONSTANTS =========================== */

  /* ====================== STUDENT WORK STARTS HERE ========================= */
  function render(){
    const itemsDiv   = document.getElementById('items');
    const summaryPre = document.getElementById('summary');
    const emptyMsg   = document.getElementById('emptyMsg');
    const isMember   = document.getElementById('memberToggle').checked;

    // 1) Load & filter
    let cart = readCart().filter(it => it && it.qty > 0 && it.unitPrice > 0);
    if (cart.length !== readCart().length) writeCart(cart);

    // helper nested inside render to keep a single external function
    function writeSummary(itemTotal, volDisc, memDisc){
      const taxable = itemTotal - volDisc - memDisc + SHIPPING_RATE;
      const taxAmt  = taxable * TAX_RATE;

      const rows = [
        ['Subtotal of Items',  money(itemTotal)],
        ['Volume Discount',    money(-volDisc)],
        ['Member Discount',    money(-memDisc)],
        ['Shipping',           money(SHIPPING_RATE)],
        ['Subtotal (Taxable)', money(taxable)],
        ['Tax Rate',           (TAX_RATE * 100).toFixed(1) + '%'],
        ['Tax Amount',         money(taxAmt)],
        ['Invoice Total',      money(taxable + taxAmt)]
      ];

      let amountWidth = 0, labelWidth = 0;
      for (const [label, amt] of rows){
        amountWidth = Math.max(amountWidth, amt.length);
        labelWidth  = Math.max(labelWidth,  label.length);
      }
      let out = '';
      for (const [label, amt] of rows){
        out += label.padEnd(labelWidth) + '  ' + amt.padStart(amountWidth) + '\n';
      }
      summaryPre.textContent = out;
      summaryPre.hidden = false;
    }

    // 2) Empty cart
    if (cart.length === 0){
      emptyMsg.hidden = false;
      itemsDiv.hidden = true;
      writeSummary(0, 0, 0);
      return;
    }

    // 3) Items list (text lines + Remove)
    itemsDiv.innerHTML = '';
    for (const it of cart){
      const line = document.createElement('div');
      line.className = 'line';

      const left = document.createElement('span');
      left.className = 'line-text';
      left.textContent = `${it.qty} × ${it.name}`;

      const amount = document.createElement('span');
      amount.className = 'line-amount';
      amount.textContent = money(it.unitPrice * it.qty);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Remove';
      btn.addEventListener('click', () => removeItem(it.id));

      line.appendChild(left);
      line.appendChild(amount);
      line.appendChild(btn);
      itemsDiv.appendChild(line);
    }
    itemsDiv.hidden = false;
    emptyMsg.hidden = true;

    // 4) Math — single-discount rule
    const itemTotal = cart.reduce((s, it) => s + it.unitPrice * it.qty, 0);
    const vRate     = volumeRate(itemTotal);
    const memberPossible = isMember;
    const volumePossible = vRate > 0;

    let applyMember = false;
    let applyVolume = false;

    if (memberPossible && volumePossible){
      const resp = (prompt(
        `Only one discount may be applied.\nType 'M' for Member (15%) or 'V' for Volume (${Math.round(vRate*100)}%).`
      ) || '').trim().toUpperCase();
      if (resp === 'M') applyMember = true;
      else if (resp === 'V') applyVolume = true;
      else applyVolume = true; // default if invalid
    } else if (memberPossible){
      applyMember = true;
    } else if (volumePossible){
      applyVolume = true;
    }

    const volDisc = applyVolume ? itemTotal * vRate : 0;
    const memDisc = applyMember ? itemTotal * MEMBER_DISCOUNT_RATE : 0;

    // 5) Single summary block
    writeSummary(itemTotal, volDisc, memDisc);
  }
  /* ======================= STUDENT WORK ENDS HERE ========================= */

  // Events → re-render
  document.getElementById('memberToggle').addEventListener('change', render);
  document.getElementById('clearBtn').addEventListener('click', clearCart);

  // First paint
  render();
  </script>
</body>
</html>
